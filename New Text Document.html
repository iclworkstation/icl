<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Codelf 0.1v – Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #121212;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .search-bar {
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .search-bar input {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      border-radius: 50px;
      border: none;
      outline: none;
      background-color: #2a2a2a;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background: #1f1f1f;
      padding: 1rem;
      border-radius: 1rem;
      transition: 0.3s ease;
      text-align: center;
    }

    .card:hover {
      background-color: #333;
    }

    .card h3 {
      margin: 0.5rem 0;
      font-size: 1.2rem;
    }

    .card p {
      font-size: 0.9rem;
      color: #bbb;
    }

    .card .buttons {
      margin-top: 1rem;
    }

    .card button {
      padding: 0.5rem 1rem;
      margin: 0.2rem;
      border: none;
      border-radius: 25px;
      background: #444;
      color: #fff;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .card button:hover {
      background: #666;
    }

    footer {
      margin-top: 3rem;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Codelf 0.1v</h1>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search projects..." />
  </div>

  <div class="grid" id="projectGrid">
    <div class="card">
      <h3>Project Lunar</h3>
      <p>Free • Web Tool</p>
      <div class="buttons">
        <button>View</button>
        <button>Download</button>
      </div>
    </div>
    <div class="card">
      <h3>Project Cargo</h3>
      <p>$5 • Game Asset Manager</p>
      <div class="buttons">
        <button>View</button>
        <button>Buy</button>
      </div>
    </div>
    <div class="card">
      <h3>StreamX</h3>
      <p>$3 • Video Downloader</p>
      <div class="buttons">
        <button>Try</button>
        <button>Buy</button>
      </div>
    </div>
    <div class="card">
      <h3>CodeSnap</h3>
      <p>Free • Code Sharing</p>
      <div class="buttons">
        <button>View</button>
        <button>Copy</button>
      </div>
    </div>
  </div>

  <footer>
    Made by Codelf Team • Version 0.1v
  </footer>

  <script>
    const input = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.card');

    input.addEventListener('input', () => {
      const val = input.value.toLowerCase();
      cards.forEach(card => {
        const match = card.innerText.toLowerCase().includes(val);
        card.style.display = match ? '' : 'none';
      });
    });
  </script>

</body>
</html>
